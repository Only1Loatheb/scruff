# The plugin cross-builds for sbt 1 (Scala 2.12) and sbt 2 (Scala 3), so its
# sources keep to syntax both compile: Scala 2.12.20 takes `import a.*`,
# `as`, `?` and `xs*` without flags.
dialect = "scala212source3"

exclude-paths = [
  # Scripted tests start from unformatted sources on purpose.
  "glob:**/src/sbt-test/**",
]
