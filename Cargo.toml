[package]
name = "scuff"
version = "0.1.0"
edition = "2024"
description = "formatter"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
hocon-parser = "1.14.2"
ignore = "0.4"
rayon = "1.12"
regex = "1"
text-size = "1.1.1"
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde"] }
tree-sitter = "0.27.1"
tree-sitter-scala = "0.26.4"

[profile.release]
strip = true
lto = true
